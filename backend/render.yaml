services:
  - type: web
    name: jaundicare-api
    env: python
    plan: free
    buildCommand: pip install -r requirements-prod.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: jaundicare-db
          property: connectionString
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: RATE_LIMIT_SALT
        sync: false
      - key: TRUST_PROXY_HEADERS
        value: "true"
      - key: ENABLE_TRAINING_IMAGE_STORAGE
        value: "false"
      - key: TERMII_API_KEY
        sync: false
      - key: TERMII_BASE_URL
        sync: false
      - key: TERMII_SENDER_ID
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: ALLOWED_HOSTS
        value: jaundicare-api.onrender.com
      - key: HELPMUM_MAMABOT_API_KEY
        sync: false
      - key: HELPMUM_VAXAI_API_KEY
        sync: false
      - key: ENVIRONMENT
        value: production

databases:
  - name: jaundicare-db
    databaseName: jaundicare
    plan: free
