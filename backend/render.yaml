services:
  - type: web
    name: jaundicare-api
    env: python
    plan: free
    buildCommand: pip install -r requirements-prod.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DB_POOL_SIZE
        value: "3"
      - key: DB_MAX_OVERFLOW
        value: "2"
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: RATE_LIMIT_SALT
        sync: false
      - key: TRUST_PROXY_HEADERS
        value: "true"
      - key: ENABLE_TRAINING_IMAGE_STORAGE
        value: "false"
      - key: TERMII_API_KEY
        sync: false
      - key: TERMII_BASE_URL
        sync: false
      - key: TERMII_SENDER_ID
        value: "OE Alert"
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: ALLOWED_HOSTS
        value: jaundicare-api.onrender.com
      - key: MAMABOT_API_KEY
        sync: false
      - key: VAXAI_API_KEY
        sync: false
      - key: ENVIRONMENT
        value: production
