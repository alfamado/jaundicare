services:
  - type: web
    name: jaundicare-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements-prod.txt
    # Free web services do not provide a separate one-off migration shell.
    # Run migrations before this single-instance service accepts requests.
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DB_POOL_SIZE
        value: "3"
      - key: DB_MAX_OVERFLOW
        value: "2"
      - key: JWT_SECRET
        generateValue: true
      - key: RATE_LIMIT_SALT
        generateValue: true
      - key: TRUST_PROXY_HEADERS
        value: "true"
      - key: ENABLE_TRAINING_IMAGE_STORAGE
        value: "false"
      - key: TRAINING_IMAGE_RETENTION_DAYS
        value: "30"
      - key: TERMII_API_KEY
        sync: false
      - key: TERMII_BASE_URL
        sync: false
      - key: TERMII_SENDER_ID
        value: "OE Alert"
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: ALLOWED_HOSTS
        value: jaundicare-api.onrender.com
      - key: MAMABOT_API_KEY
        sync: false
      - key: VAXAI_API_KEY
        sync: false
      - key: ENVIRONMENT
        value: production
